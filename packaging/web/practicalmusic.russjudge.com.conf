# Apache site for the Practical Music website: https://practicalmusic.russjudge.com
# Install (Debian):  sudo cp practicalmusic.russjudge.com.conf /etc/apache2/sites-available/
#                    sudo a2enmod proxy proxy_http headers ssl rewrite
#                    sudo a2ensite practicalmusic.russjudge.com && sudo apachectl configtest && sudo systemctl reload apache2
# For another host name, replace practicalmusic.russjudge.com everywhere in this file (and the file name).
# The certificate comes from Let's Encrypt: see docs/INSTALL-Server-Debian.md, step 7.

<VirtualHost *:80>
    ServerName practicalmusic.russjudge.com
    # Let's Encrypt renewals use http://…/.well-known/acme-challenge/; everything else goes to https
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName practicalmusic.russjudge.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/practicalmusic.russjudge.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/practicalmusic.russjudge.com/privkey.pem
    <IfFile "/etc/letsencrypt/options-ssl-apache.conf">
        Include /etc/letsencrypt/options-ssl-apache.conf
    </IfFile>

    # Pass everything to the website (Kestrel, only reachable from this machine).
    # upgrade=websocket lets /ws/sync (synchronized playback) through; Apache 2.4.47+ (Debian 13: 2.4.6x).
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:5080/ upgrade=websocket timeout=600
    ProxyPassReverse / http://127.0.0.1:5080/

    # whole books (PDFs + recordings) are uploaded in one request; the website itself limits them
    # (Site:MaxUploadMegabytes, 600 MB by default)
    LimitRequestBody 0

    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/practicalmusic-error.log
    CustomLog ${APACHE_LOG_DIR}/practicalmusic-access.log combined
</VirtualHost>
</IfModule>
